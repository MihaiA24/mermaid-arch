[project]
name = "mermaid-arch"
version = "0.1.1"
description = "Render Mermaid and D2 architecture diagrams to checked SVG, PNG, PDF and standalone HTML."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
dependencies = [
    "d2-python-wrapper>=0.2.0",
    "fonttools[woff]>=4.50",
    "playwright>=1.49",
]

[project.urls]
Repository = "https://github.com/MihaiA24/mermaid-arch"

[project.scripts]
mermaid-arch = "mermaid_arch.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mermaid_arch"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/mermaid_arch/assets"]
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: needs a launchable headless Chromium",
]
