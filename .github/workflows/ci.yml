name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uv run --frozen ruff check .
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uv run --frozen ruff format --check .
      # The runner's Google Chrome renders (on PATH on Linux, under /Applications on macOS);
      # browser tests fail rather than skip when no Chromium launches.
      - run: uv run --frozen pytest -q
        env:
          MERMAID_ARCH_REQUIRE_BROWSER: "1"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Check the tag names the project version
        run: test "$GITHUB_REF_NAME" = "v$(uv version --short)"
      - run: uv build
      - name: Publish the wheel and sdist as a GitHub release
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
